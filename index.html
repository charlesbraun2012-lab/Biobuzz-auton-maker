<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>biobuzz FTC Auto Simulator</title>
<style>
:root{--bg:#15130e;--surf:#201d15;--text:#f1eee3;--mute:#a59f8d;--line:#383323;--acc:#f2b632;--field:#2a261b;--grid:#413b29;--robot:#60a5fa;--bad:#f87171;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#ffffff;--surf:#ffffff;--text:#1d1b16;--mute:#6b665a;--line:#e3e0d6;--acc:#e8a317;--field:#e9e6dc;--grid:#cfcabb;--robot:#2563eb;--bad:#dc2626;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0}header span{color:var(--mute);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding:16px;max-width:1240px;margin:auto}
@media(max-width:880px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
canvas{width:100%;aspect-ratio:1;display:block;border-radius:8px;cursor:crosshair;touch-action:manipulation}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button,select,input,textarea{font:inherit;color:var(--text)}
button{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#1d1b16;font-weight:600}
input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:68px}
select{width:auto}input[type=range]{flex:1;min-width:120px;accent-color:var(--acc)}
.time{font-variant-numeric:tabular-nums;font-weight:600}.time.over{color:var(--bad)}
h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.row{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;margin-bottom:4px;border:1px solid transparent;flex-wrap:wrap}
.row.act{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.row b{font-size:13px;min-width:78px}.row label{font-size:12px;color:var(--mute)}.row input{width:58px}
.row small{color:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}.x{margin-left:auto;padding:2px 8px}
#list{max-height:320px;overflow-y:auto;margin-bottom:8px}
.set{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}.set label{display:flex;justify-content:space-between;align-items:center;gap:6px}
.hint{color:var(--mute);font-size:12px;margin:8px 0 0}
#status{font-size:13px;margin-top:8px;min-height:1.4em}#status .bad{color:var(--bad);font-weight:600}
textarea{width:100%;height:110px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font:12px monospace;padding:6px;margin-top:8px}
.stack{display:flex;flex-direction:column;gap:16px}
button.sm{font-size:12px;padding:3px 9px;border-radius:7px}.hint:empty{display:none}
.tools{gap:6px 8px}.tools label{font-size:12px;display:flex;align-items:center;gap:4px}.tools input[type=number]{width:50px;padding:2px 5px;font-size:12px}.tools select{padding:2px 4px;font-size:12px}.tools input[type=checkbox]{width:auto}
summary{cursor:pointer;list-style-position:inside}summary h2{vertical-align:middle}
.mrow input[type=text]{width:118px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}.mrow input[type=number]{width:52px}.mrow input[type=checkbox]{width:auto}.mrow b{min-width:92px}
#aiq{height:76px;margin-top:0}.chips button{font-size:12px;padding:3px 9px;color:var(--mute)}#aimsg{min-height:1.4em;white-space:pre-wrap}
label.chk{font-size:13px;display:flex;gap:6px;align-items:center}
/* polish */
[hidden]{display:none!important}
:root{--r:999px;--surf2:color-mix(in srgb,var(--text) 6%,var(--surf));--shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.2);--good:#4ade80}
:root[data-theme="light"]{--surf2:#f5f3ee;--shadow:0 1px 2px rgba(29,27,22,.08),0 6px 18px rgba(29,27,22,.07);--good:#16a34a}
.card{border-radius:18px;box-shadow:var(--shadow)}canvas{border-radius:14px}
button{border-radius:var(--r);padding:7px 16px;font-weight:500;background:var(--surf2);transition:background .15s,border-color .15s,transform .08s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--surf2))}
button:active:not(:disabled){transform:scale(.96)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
button.p{box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 35%,transparent)}button.p:hover:not(:disabled){background:var(--acc);filter:brightness(1.08)}
button.sm{padding:4px 13px;border-radius:var(--r)}#play{padding:9px 24px;font-size:15px}
.x{width:26px;height:26px;padding:0;border-radius:50%;display:inline-grid;place-items:center;line-height:1}
.chips button{border-radius:var(--r)}
input[type=number],input[type=text],select,textarea{border-radius:10px}
input[type=number]:focus,input[type=text]:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc)}.row{border-radius:12px}
.seg{margin-left:auto;display:flex;align-items:center;gap:8px}.seg b{font-size:13px;color:var(--mute);font-weight:600}
.segbtn{display:flex;padding:3px;gap:2px;background:var(--surf2);border:1px solid var(--line);border-radius:var(--r)}
.segbtn button{border:0;background:transparent;padding:5px 16px;box-shadow:none}.segbtn button.p{background:var(--acc);color:#1d1b16}
.startchk{font-size:12px;margin-top:10px;padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surf2)}
.startchk.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}.startchk.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,var(--line));font-weight:600}
</style>
</head>
<body>
<header><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><ellipse cx="13" cy="15" rx="8" ry="6" fill="#e8a317"/><path d="M9 11v8M13 10v10M17 11v8" stroke="#1d1b16" stroke-width="2"/><ellipse cx="9" cy="8" rx="4" ry="3" fill="#93c5fd" opacity=".8"/><ellipse cx="17" cy="8" rx="4" ry="3" fill="#93c5fd" opacity=".8"/></svg>
<h1>biobuzz Auto Simulator</h1><span>FTC · 144″ field · 30 s autonomous</span>
<div class="seg"><b>Drive</b><div class="segbtn"><button id="dm-tank" class="p">Tank</button><button id="dm-strafe">Strafer</button></div></div></header>
<main>
<section class="card">
<canvas id="cv" width="720" height="720"></canvas>
<div class="bar">
<button class="p" id="play">▶ Play</button>
<input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Timeline">
<span class="time" id="time">0.0 / 0.0 s</span></div>
<div class="bar tools">
<button class="sm" id="reset">⏮ Reset</button><button class="sm" id="startpick">📍 Set start</button><button class="sm" id="draw">✎ Draw path</button>
<label>Power <input type="number" id="pp" step=".1" min=".05" max="1" value=".6"></label><label>Smoothing″ <input type="number" id="ptol" step=".5" min=".5" value="2"></label>
<label class="chk" id="pkeepw" hidden><input type="checkbox" id="pkeep" checked> Keep heading</label>
<label>Speed <select id="rate"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select>×</label>
<label><input type="checkbox" id="trail" checked> Trail</label><span id="pose" class="hint" style="margin:0 0 0 4px"></span>
<button class="sm" id="theme" aria-label="Switch theme" title="Switch theme" style="margin-left:auto;background:#d97757;border-color:#d97757;padding:4px 7px;line-height:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="12" x2="21.90" y2="13.39"/><line x1="12" y1="12" x2="17.20" y2="16.06"/><line x1="12" y1="12" x2="15.37" y2="20.34"/><line x1="12" y1="12" x2="10.97" y2="19.33"/><line x1="12" y1="12" x2="5.60" y2="20.20"/><line x1="12" y1="12" x2="6.25" y2="14.32"/><line x1="12" y1="12" x2="2.69" y2="10.69"/><line x1="12" y1="12" x2="6.48" y2="7.69"/><line x1="12" y1="12" x2="8.25" y2="2.73"/><line x1="12" y1="12" x2="12.95" y2="5.27"/><line x1="12" y1="12" x2="17.66" y2="4.75"/><line x1="12" y1="12" x2="19.05" y2="9.15"/></svg></button></div>
<div id="status"></div>
<p class="hint" id="pmsg"></p>
</section>
<div class="stack">
<section class="card"><h2>Generate with Claude</h2>
<textarea id="aiq" maxlength="2000" placeholder="Describe your auto, e.g. “Drive forward 3 feet, turn right, then drive to the center of the field.”"></textarea>
<div class="bar"><button class="p" id="aigo" disabled>Generate auto</button><button class="sm" id="aistop" hidden>Stop</button><button class="sm" id="aiundo" hidden>Undo</button><label class="chk"><input type="checkbox" id="aimod"> Modify current auto</label></div>
<div class="bar chips"><button data-ex="Drive forward 36 inches, turn right 90 degrees, then drive forward 24 inches.">Forward, right, forward</button><button data-ex="Drive in a square, 30 inches per side, ending where it started.">Square lap</button><button data-ex="Drive to the center of the field and stop facing right.">Go to center</button></div>
<p class="hint" id="aimsg">Connecting…</p></section>
<section class="card"><details id="stepsbox"><summary><h2 style="display:inline;margin:0">Autonomous steps</h2> <span id="scount" class="hint" style="margin:0 0 0 8px"></span></summary><div id="list" style="margin-top:8px"></div>
<div class="bar" style="margin-top:0">
<button class="sm" data-add="drive">+ Drive</button><button class="sm" data-add="turn">+ Turn</button><button class="sm" data-add="timed">+ Timed power</button><button class="sm" data-add="strafe" hidden>+ Strafe</button><button class="sm" data-add="move" hidden>+ Move</button><button class="sm" data-add="wait">+ Wait</button><button class="sm" data-add="shoot">+ Shoot</button></div>
</details></section>
<section class="card"><h2>Drawn paths</h2><div id="plist"></div>
<div class="bar" style="margin-top:0"><button class="sm" id="erase">⌫ Eraser</button><button class="sm" id="pundo" hidden>Undo</button><button class="sm" id="pclear">Delete all drawings</button></div>
</section>
<section class="card"><h2>Robot &amp; start</h2><div class="set">
<label>Start X″ <input type="number" id="sx"></label><label>Start Y″ <input type="number" id="sy"></label>
<label>Start heading° <input type="number" id="sh"></label><label>Robot size″ <input type="number" id="size"></label>
<label>Speed at power 1 (in/s) <input type="number" id="vmax"></label><label>Wheel track″ <input type="number" id="track"></label>
<label>Left motor strength % <input type="number" id="drift"></label><label>Strafe speed % (strafer) <input type="number" id="seff"></label></div>
<div id="startchk" class="startchk"></div>
<div class="bar"><label class="chk"><input type="checkbox" id="ssnap" checked> Snap start to the wall</label></div>
<div class="bar"><b style="font-size:12px">Turn robot</b><button class="sm" data-rot="90" title="Turn left 90°">⟲ 90°</button><button class="sm" data-rot="15" title="Turn left 15°">⟲ 15°</button><button class="sm" data-rot="-15" title="Turn right 15°">⟳ 15°</button><button class="sm" data-rot="-90" title="Turn right 90°">⟳ 90°</button></div>
<div class="bar"><button class="sm" id="red">Red start (bottom)</button><button class="sm" id="blue">Blue start (top)</button><button class="sm" id="demo">Load demo</button><button class="sm" id="clear">Clear</button></div></section>
<section class="card"><h2>Motors (for the Java export)</h2><div id="mlist"></div><p class="hint" id="mwarn" style="margin-top:0"></p>
</section>
<section class="card"><h2>Match your real robot</h2>
<div class="row"><b>Drive test</b><label>Asked <input type="number" id="cda" value="48" min="1" step="any">″</label><label>It went <input type="number" id="cdg" min="0" step="any">″</label><button class="sm" id="cdb">Apply</button></div>
<div class="row"><b>Turn test</b><label>Asked <input type="number" id="cta" value="90" min="1" step="any">°</label><label>It turned <input type="number" id="ctg" min="0" step="any">°</label><button class="sm" id="ctb">Apply</button></div>
<div class="row"><b>Encoder test</b><label>Asked <input type="number" id="cea" value="48" min="1" step="any">″</label><label>It went <input type="number" id="ceg" min="0" step="any">″</label><button class="sm" id="ceb">Apply</button></div>
<p class="hint" id="cmsg"></p></section>
<section class="card"><h2>Field</h2>
<label class="chk"><input type="checkbox" id="fon" checked> Show the BIOBUZZ field image (flowers block the robot)</label>
<label class="chk"><input type="checkbox" id="fun" checked> Robot can drive under the hive</label>
</section>
<section class="card"><h2>Save / share / code</h2>
<div class="bar" style="margin-top:0"><button class="sm" id="exp">Export JSON</button><button class="sm" id="imp">Import JSON</button><button class="sm" id="java">Make Java</button></div>
<div class="bar tools"><label class="chk"><input type="checkbox" id="jimu" checked> Turn with the IMU</label>
<label>Hub logo <select id="jlogo"><option>UP</option><option>DOWN</option><option>FORWARD</option><option>BACKWARD</option><option>LEFT</option><option>RIGHT</option></select></label>
<label>USB <select id="jusb"><option>FORWARD</option><option>BACKWARD</option><option>UP</option><option>DOWN</option><option>LEFT</option><option>RIGHT</option></select></label></div>
<div class="bar tools"><label class="chk"><input type="checkbox" id="jenc"> Use encoders</label>
<label>Counts per wheel turn <input type="number" id="jcpr" step="any" min="1" placeholder="537.7"></label>
<label>Wheel diameter″ <input type="number" id="jdia" step="any" min="0.1" placeholder="4.09"></label></div>
<textarea id="out" spellcheck="false" placeholder="Export JSON, paste JSON here and press Import, or make a time-based LinearOpMode."></textarea>
</section>
</div>
</main>

 const prompt='You write autonomous routines for a simulator of an FTC robot with '+(dm.m==='strafe'?'a four-motor mecanum drive that can strafe':'a two-motor tank drive (no strafing)')+'.\n\n'+
 'Coordinates: the field is 144 in square, origin at center, +X right, +Y up. Heading 0 degrees faces +X, 90 faces +Y. Positive turns are counter-clockwise (left).\n'+
 'Robot: '+cfg.size+' in square, '+cfg.vmax+' in/s at power 1, wheel track '+cfg.track+' in.\n'+
 'Start pose: x='+cfg.sx+', y='+cfg.sy+', heading='+cfg.sh+' degrees.\n'+elDesc()+'\n'+
 'Allowed steps:\n{"t":"drive","d":inches (negative = backward),"p":0.05 to 1}\n{"t":"turn","a":degrees (positive = left),"p":0.05 to 1}\n{"t":"timed","l":-1 to 1,"r":-1 to 1,"s":seconds}  (left and right motor power for a time)\n{"t":"wait","s":seconds}\n{"t":"shoot","n":number of balls,"p":0.05 to 1 shooter power,"s":seconds the shooter runs (the robot stands still)}\n'+(dm.m==='strafe'?'{"t":"strafe","d":inches (positive = right),"p":0.05 to 1}\n{"t":"move","f":forward inches,"r":right inches,"p":0.05 to 1}  (straight-line move, heading unchanged)\n':'')+'\n'+
 'Rules:\n- The whole auto must take 30 seconds or less and the robot body must stay inside the field and clear of the flowers and walls (and of the hive unless the field layout says the robot can drive under it). Robots start touching a field wall on their own alliance half (red = bottom, y below 0; blue = top, y above 0). A square robot cannot spin in place right next to a wall because its corners hit it, so drive away from the wall before turning.\n- Before answering, check your plan with the simulate_auto tool (at most 3 checks) and fix any collision or time overrun.\n- Default to drive power 0.5-0.7 and turn power 0.3-0.5 unless asked otherwise.\n- If a request needs a position that is not listed above and gives no coordinates, use a clearly stated placeholder position and say so in notes.\n\n'+
 (modify?'Current auto (change it as requested and return the full updated list; steps with t path are drawn paths, so keep them in place and copy them exactly as given):\n'+JSON.stringify(steps.map(q=>q.t==='path'?{t:'path',ref:q.g}:q))+'\n\n':'')+
 'Request: '+q+'\n\nReply with ONLY a JSON object: {"steps":[...],"start":{"x":0,"y":0,"h":90},"notes":"one or two plain sentences"}. Include "start" only when the request calls for a different start pose.';
 ctl=new AbortController();ai.go.disabled=true;ai.stop.hidden=false;ai.msg.textContent='Thinking…';
 try{
  const res=await sample.json(prompt,{signal:ctl.signal,tools:[tool],cache:false,onText:()=>{ai.msg.textContent='Writing the auto…'}});
  const{out,bad}=expandAI(Array.isArray(res)?res:res&&res.steps,curPaths);
  if(!out.length)throw{code:'empty',message:'Claude didn’t return any usable steps. Try describing the auto differently.'};
  snap={cfg:{...cfg},steps:JSON.parse(JSON.stringify(steps))};steps=out;
  const st=res&&res.start;
  if(st&&isFinite(num(st.x))&&isFinite(num(st.y))&&isFinite(num(st.h))){cfg.sx=num(st.x);cfg.sy=num(st.y);cfg.sh=num(st.h);for(const k of['sx','sy','sh'])$(k).value=cfg[k]}
  t=0;refresh();playing=true;last=performance.now();draw();ai.undo.hidden=false;
  ai.msg.textContent=(res&&typeof res.notes==='string'&&res.notes?res.notes:'Done.')+(bad?' ('+bad+' invalid step'+(bad>1?'s were':' was')+' skipped.)':'');
 }catch(e){const c=e&&e.code;
  ai.msg.textContent=c==='cancelled'?'Stopped.':c==='not_granted'?'Allow Claude access when asked to generate autos.':c==='rate_limited'?'Too many requests. Wait a moment and try again.':'Couldn’t generate an auto: '+((e&&e.message)||'unknown error')}
 finally{ai.go.disabled=false;ai.stop.hidden=true;ctl=null}};
renderMotors();refresh();requestAnimationFrame(tick);
</script>
